# TristanPbty's Armor HUD

TristanPbty's Armor HUD is a lightweight native Horizon mod that displays the player's equipped armor in a clean and minimal HUD.

## Features
- Minimal and clean armor HUD.
- Displays equipped armor pieces.
- Lightweight native implementation.
- Inspired by Uku's Armor HUD.

## How to use
Install the mod through Horizon and launch the game. The armor HUD will display your currently equipped armor.

## Credits
Created by TristanPbty."""
