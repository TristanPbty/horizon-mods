description = """
# TristanPbty's Lib

TristanPbty's Lib is a shared Rust library developed by TristanPbty for Horizon native mods.

It provides reusable components and common functionality to help organize and simplify the development of multiple native Horizon projects.

## Features

- Shared Rust components.
- Reusable functionality.
- Centralized code for multiple projects.
- Modular architecture.
- Designed for Horizon native mod development.

## How to use

Install the mod beside the native mods that use it: the launcher stages its crate into the game build, where a mod's injected module reaches it as `tristanpbty_lib::…`.

TristanPbty's Armor Hud embeds its own copy under its own crate name and no longer requires this mod beside it; this library is the shared foundation for TristanPbty's future native mods, and both install side by side without conflict.

## Requirements

- Rust toolchain.
- Compatible Horizon native mod development environment.

## Credits

Created and maintained by TristanPbty.

## License

MIT License."""
