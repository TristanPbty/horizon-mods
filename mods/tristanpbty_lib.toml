changelog = """
Release notes for 1.1.0.

Tristan's Lib is the shared foundation of TristanPbty's native Horizon mods: the configuration system, the UI widgets and the Minecraft tool abstractions, staged into the game build as its own crate (a horizon-mixins bundle crate that horizon-client depends on). Zero dependencies, so it fits the bundle-crate rule and stays testable outside the game.

- Configuration: schemas with labels, help, defaults and limits; typed values (bool, int, float, string, enum, color, keybind, position, scale); JSON validation and coercion; versioned migrations that refuse files from the future; atomic saves with a .bak backup; a debounced runtime with change listeners and reset.
- Widgets: the plain vanilla-style cycling button the configuration screens are built from (Label: Value, one click or scroll per step), plus button, toggle, slider, dropdown, number input, color picker, keybind, position editor and scale selector - all as abstract draw-command and input-event code.
- Minecraft abstractions: equipment snapshots, durability math and warning thresholds, the anchor and geometry vocabulary.
- 73 tests, Rust 1.95.0, pinned to Horizon Nightly 2026-11-08 (fdc87ae) and Horizon Mixins 0.6.0 (d9c83d7).

TristanPbty's Armor Hud 1.1.0 now embeds its own copy of this library under its own crate name (tristanpbty_armor_hud_lib) and no longer requires this mod beside it; this library remains the shared foundation for TristanPbty's future native mods, and the two mods install side by side without conflict."""
